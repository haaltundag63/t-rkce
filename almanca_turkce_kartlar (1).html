<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eaf6ff">
<title>Almanca-Türkçe Kartlar</title>
<style>
  :root{
    --pink:#7fb8dd; --peach:#7fc8d8; --mint:#7fcbaa; --sky:#5fa8d8; --lav:#4fb8a8; --yellow:#9ed88f; --coral:#5fb8c8; --teal:#6fb3a8;
    --ink:#1a1a2e;
    color-scheme: light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:linear-gradient(160deg,#0a4a45,#0f6e60);}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0a4a45,#0f6e60);color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#0a4a45,#0f6e60);}

  /* ---------- Screens ---------- */
  .screen{flex:1;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}
  .screen.active{display:flex;}

  h1{font-size:1.4rem;margin:6px 0 4px;text-align:center;color:#fff;}
  .sub{text-align:center;color:rgba(255,255,255,.8);font-size:.85rem;margin-bottom:14px;}

  .card-btn{
    background:#f7f7fa;
    border:1px solid #ececf2;border-radius:16px;padding:14px 16px;margin:6px 0;
    display:flex;justify-content:space-between;align-items:center;color:var(--ink);
    box-shadow:0 1px 4px rgba(0,0,0,.05);font-size:1rem;text-align:left;cursor:pointer;
  }
  .card-btn .count{background:#cdeee0;color:var(--ink);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;margin-left:10px;}
  .card-btn:active{transform:scale(.98);}

  #sectionGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-card{
    border-radius:22px;padding:18px 16px 16px;text-align:left;border:none;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;min-height:150px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
  }
  .grid-card .g-title{font-size:1.05rem;font-weight:800;color:#fff;line-height:1.25;margin-bottom:6px;}
  .grid-card .g-desc{font-size:.78rem;color:rgba(255,255,255,.85);line-height:1.3;flex:1;}
  .grid-card .g-count{align-self:flex-start;margin-top:10px;background:rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:4px 12px;font-size:.78rem;font-weight:700;}
  .grid-card .g-progress-track{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px;}
  .grid-card .g-progress-fill{height:100%;background:#fff;border-radius:3px;}
  .grid-card:active{transform:scale(.97);}
  .all-card{
    border-radius:22px;padding:16px 18px;margin-bottom:12px;border:1px solid #ececf2;background:#f7f7fa;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .all-card .g-title{font-size:1rem;font-weight:800;color:var(--ink);}
  .all-card:active{transform:scale(.98);}

  .pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px;}
  .pill{border:1px solid #e2e2ea;border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:700;background:#f7f7fa;color:var(--ink);box-shadow:none;cursor:pointer;}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .top-actions{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;}
  .icon-btn{background:#f7f7fa;color:var(--ink);border:1px solid #ececf2;border-radius:12px;padding:10px 14px;font-size:1rem;box-shadow:none;cursor:pointer;}

  /* ---------- Study screen ---------- */
  #studyScreen{padding:10px 14px;}
  #progressBar{height:6px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin:4px 0 10px;}
  #progressFill{height:100%;background:linear-gradient(90deg,#5fa8d8,#6fc4a8);width:0%;transition:width .25s;}
  #progressLabel{text-align:center;font-size:.8rem;color:rgba(255,255,255,.85);margin-bottom:8px;}

  #cardStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1000px;min-height:260px;}
  .flash-card{
    width:100%;max-width:480px;min-height:260px;border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:34px 22px 28px;font-size:1.35rem;font-weight:700;line-height:1.4;color:#ffffff;
    background:linear-gradient(160deg,var(--accent-a,#1fae8e),var(--accent-b,#2fd6a8));
    box-shadow:0 12px 32px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);
    position:relative;cursor:pointer;
    -webkit-user-select:none;user-select:none;
    text-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .flash-card .tag{position:absolute;top:14px;left:18px;font-size:.7rem;font-weight:800;opacity:.85;letter-spacing:.05em;text-transform:uppercase;color:#fff;}
  .flash-card .hint{position:absolute;bottom:12px;font-size:.7rem;font-weight:600;opacity:.8;color:#fff;}

  #navRow{display:flex;justify-content:center;gap:14px;margin:16px 0 6px;}
  .nav-btn{width:56px;height:56px;border-radius:50%;border:1px solid #ececf2;font-size:1.4rem;background:#f7f7fa;color:var(--ink);box-shadow:none;cursor:pointer;}
  .nav-btn:active{transform:scale(.92);}
  #flipBtn{width:auto;border-radius:999px;padding:0 22px;font-size:1rem;font-weight:800;background:var(--ink);border:none;color:#fff;}

  #bottomBar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 4px;font-size:.85rem;color:rgba(255,255,255,.75);}
  #bottomBar button{background:none;border:none;font-size:.85rem;color:rgba(255,255,255,.9);text-decoration:underline;cursor:pointer;}

  #fsBtn{position:fixed;top:10px;right:10px;z-index:50;background:#f7f7fa;color:var(--ink);border:1px solid #ececf2;border-radius:10px;width:38px;height:38px;box-shadow:none;font-size:1rem;}

  body.zen-mode .top-actions,
  body.zen-mode #bottomBar,
  body.zen-mode #progressLabel{display:none !important;}
  body.zen-mode #studyScreen{padding:env(safe-area-inset-top,20px) 14px 20px;}
  body.zen-mode #progressBar{margin-top:6px;}
  body.zen-mode #cardStage{min-height:70vh;}
  body.zen-mode .flash-card{max-width:640px;min-height:340px;font-size:1.7rem;padding:44px 30px;}
  body.zen-mode #navRow{margin-top:24px;}
  body.zen-mode #fsBtn{background:rgba(255,255,255,.9);}

  .done-box{text-align:center;margin:auto;color:#fff;}
  .done-box .emoji{font-size:3rem;}

  @media (max-width:380px){
    .flash-card{font-size:1.15rem;padding:22px 16px;}
    h1{font-size:1.2rem;}
  }

  @media (min-width:700px){
    #homeScreen, #setupScreen, #studyScreen{max-width:900px;margin:0 auto;width:100%;}
    h1{font-size:2rem;}
    .sub{font-size:1.05rem;}
    #sectionGrid{grid-template-columns:1fr 1fr 1fr;gap:18px;}
    .grid-card{min-height:190px;padding:24px 22px 20px;}
    .grid-card .g-title{font-size:1.3rem;}
    .grid-card .g-desc{font-size:.92rem;}
    .grid-card .g-count{font-size:.9rem;padding:6px 16px;}
    .flash-card{max-width:680px;min-height:380px;font-size:1.9rem;padding:48px 40px;border-radius:32px;}
    .flash-card .tag{font-size:.85rem;top:20px;left:26px;}
    .flash-card .hint{font-size:.85rem;bottom:20px;}
    #navRow{gap:24px;margin:28px 0 10px;}
    .nav-btn{width:72px;height:72px;font-size:1.8rem;}
    #flipBtn{padding:0 34px;font-size:1.3rem;}
    #progressBar{max-width:680px;margin-left:auto;margin-right:auto;}
    #progressLabel{font-size:1rem;}
    .icon-btn{font-size:1.1rem;padding:12px 18px;}
  }
</style>
</head>
<body>
<div id="app">
  <button id="fsBtn" onclick="toggleFullscreen()">⛶</button>

  <!-- HOME -->
  <div class="screen active" id="homeScreen">
    <h1>🇩🇪 Almanca–Türkçe Kartlar 🇹🇷</h1>
    <div class="sub" id="totalLabel"></div>
    <div id="allCardWrap"></div>
    <div id="sectionGrid"></div>
  </div>

  <!-- SETUP -->
  <div class="screen" id="setupScreen">
    <div class="top-actions">
      <button class="icon-btn" onclick="goHome()">← Geri</button>
      <div style="font-weight:700;color:#fff;" id="setupTitle"></div>
      <div style="width:70px;"></div>
    </div>
    <div class="sub">Kaç kartlık bir grup çalışmak istersin?</div>
    <div class="pill-row" id="groupSizePills"></div>
    <div class="pill-row">
      <button class="pill" id="shuffleToggle" onclick="toggleShuffle()">🔀 Karıştır: Kapalı</button>
    </div>
    <div id="groupList"></div>
  </div>

  <!-- STUDY -->
  <div class="screen" id="studyScreen">
    <div class="top-actions">
      <button class="icon-btn" onclick="goSetupBack()">← Geri</button>
      <div style="font-weight:700;font-size:.9rem;color:#fff;" id="studySectionLabel"></div>
      <button class="icon-btn" onclick="restartGroup()">↻</button>
    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel"></div>
    <div id="cardStage"></div>
    <div id="navRow">
      <button class="nav-btn" onclick="prevCard()">‹</button>
      <button class="nav-btn" id="flipBtn" onclick="flipCard()">Çevir</button>
      <button class="nav-btn" onclick="nextCard()">›</button>
    </div>
    <div id="bottomBar">
      <span>Kaydırarak da gezinebilirsin</span>
      <button onclick="goHome()">Ana menü</button>
    </div>
  </div>
</div>

<script>
const PALETTE = [
  ['#1fae8e','#2fd6a8'],
  ['#178f9e','#2bc4c0'],
  ['#1a9e7a','#4fd88f'],
  ['#127a96','#22b0b8'],
  ['#0f9488','#34c9a3'],
  ['#1c8f6f','#5ed6a0'],
  ['#136b8a','#1fa9a0'],
  ['#0e8a6f','#3fcf9a']
];
let ALL = window.FLASHCARDS || [];
let currentSection = null; // null = all
let currentGroup = []; // array of card objects for active study session
let groupSize = 15;
let shuffleOn = false;
let idx = 0;
let flipped = false;

const PROGRESS_KEY = 'almanca_turkce_kartlar_progress_v1';
let PROGRESS = {};
try {
  PROGRESS = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
} catch(e) { PROGRESS = {}; }

function cardKey(c){ return c.section + '||' + c.front; }
function isChecked(c){ return !!PROGRESS[cardKey(c)]; }
function markChecked(c){
  const k = cardKey(c);
  if(!PROGRESS[k]){
    PROGRESS[k] = true;
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(PROGRESS)); } catch(e) {}
  }
}
function checkedCount(cards){
  let n = 0;
  for(const c of cards){ if(isChecked(c)) n++; }
  return n;
}

function bySection(){
  const map = {};
  ALL.forEach(c=>{ (map[c.section] = map[c.section]||[]).push(c); });
  return map;
}

function renderHome(){
  const totalChecked = checkedCount(ALL);
  document.getElementById('totalLabel').textContent = ALL.length + ' kart · ' + Object.keys(bySection()).length + ' bölüm · ' + totalChecked + '/' + ALL.length + ' kontrol edildi';
  const sections = bySection();
  const allWrap = document.getElementById('allCardWrap');
  allWrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'all-card';
  allBtn.innerHTML = '<span class="g-title">📚 Tüm Kartlar</span><span class="count">'+totalChecked+'/'+ALL.length+' ✓</span>';
  allBtn.onclick = () => openSetup(null);
  allWrap.appendChild(allBtn);

  const grid = document.getElementById('sectionGrid');
  grid.innerHTML = '';
  const sortedSecs = Object.keys(sections).sort((a,b)=>sections[b].length-sections[a].length);
  sortedSecs.forEach((sec,i)=>{
    const cards = sections[sec];
    const teaser = cards[0] ? cards[0].front : '';
    const done = checkedCount(cards);
    const pct = cards.length ? Math.round((done/cards.length)*100) : 0;
    const btn = document.createElement('button');
    btn.className = 'grid-card';
    btn.style.background = 'linear-gradient(135deg,' + PALETTE[i % PALETTE.length][0] + ',' + PALETTE[i % PALETTE.length][1] + ')';
    btn.innerHTML =
      '<div class="g-title">'+escapeHtml(sec)+'</div>'+
      '<div class="g-desc">'+escapeHtml(teaser.slice(0,60))+(teaser.length>60?'…':'')+'</div>'+
      '<div class="g-progress-track"><div class="g-progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="g-count">'+done+'/'+cards.length+' kontrol edildi</div>';
    btn.onclick = () => openSetup(sec);
    grid.appendChild(btn);
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatCardText(s){
  const parts = s.split('\n');
  if(parts.length > 1){
    return '<div style="font-size:1.05em;font-weight:800;margin-bottom:10px;">'+escapeHtml(parts[0])+'</div>'+
           '<div style="font-size:.8em;font-weight:500;opacity:.85;">'+parts.slice(1).map(escapeHtml).join('<br>')+'</div>';
  }
  return escapeHtml(s);
}

function openSetup(section){
  currentSection = section;
  document.getElementById('setupTitle').textContent = section ? section : 'Tüm Kartlar';
  const sizes = [10,15,20,30];
  const pillRow = document.getElementById('groupSizePills');
  pillRow.innerHTML = '';
  sizes.forEach(sz=>{
    const p = document.createElement('button');
    p.className = 'pill' + (sz===groupSize?' active':'');
    p.textContent = sz + ' kart';
    p.onclick = ()=>{ groupSize = sz; renderSetup(); };
    pillRow.appendChild(p);
  });
  updateShuffleLabel();
  renderSetup();
  showScreen('setupScreen');
}

function updateShuffleLabel(){
  document.getElementById('shuffleToggle').textContent = '🔀 Karıştır: ' + (shuffleOn ? 'Açık' : 'Kapalı');
}
function toggleShuffle(){ shuffleOn = !shuffleOn; updateShuffleLabel(); renderSetup(); }

function renderSetup(){
  // refresh pill active states
  document.querySelectorAll('#groupSizePills .pill').forEach(p=>{
    p.classList.toggle('active', p.textContent.startsWith(groupSize+''));
  });
  const pool = currentSection ? ALL.filter(c=>c.section===currentSection) : ALL.slice();
  const groupList = document.getElementById('groupList');
  groupList.innerHTML = '';
  const n = Math.ceil(pool.length / groupSize);
  for(let g=0; g<n; g++){
    const start = g*groupSize;
    const chunk = pool.slice(start, start+groupSize);
    const done = checkedCount(chunk);
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.innerHTML = '<span>Grup '+(g+1)+'</span><span class="count">'+done+'/'+chunk.length+' ✓</span>';
    btn.onclick = ()=> startStudy(chunk);
    groupList.appendChild(btn);
  }
}

function shuffleArr(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startStudy(chunk){
  currentGroup = shuffleOn ? shuffleArr(chunk) : chunk.slice();
  idx = 0; flipped = false;
  document.getElementById('studySectionLabel').textContent = currentSection || 'Tüm Kartlar';
  showScreen('studyScreen');
  renderCard();
}

function restartGroup(){
  currentGroup = shuffleOn ? shuffleArr(currentGroup) : currentGroup;
  idx = 0; flipped = false;
  renderCard();
}

function renderCard(){
  const stage = document.getElementById('cardStage');
  if(idx >= currentGroup.length){
    stage.innerHTML = '<div class="done-box"><div class="emoji">🎉</div><div style="font-size:1.1rem;font-weight:700;margin-top:8px;">Grubu bitirdin!</div></div>';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressLabel').textContent = currentGroup.length + ' / ' + currentGroup.length;
    return;
  }
  const c = currentGroup[idx];
  const color = PALETTE[idx % PALETTE.length];
  flipped = false;
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'flash-card';
  card.style.setProperty('--accent-a', color[0]);
  card.style.setProperty('--accent-b', color[1]);
  card.innerHTML = '<span class="tag">Almanca</span>' + formatCardText(c.front) + '<span class="hint">Çevirmek için dokun</span>';
  card.onclick = flipCard;
  stage.appendChild(card);
  document.getElementById('progressFill').style.width = Math.round((idx/currentGroup.length)*100)+'%';
  document.getElementById('progressLabel').textContent = (idx+1) + ' / ' + currentGroup.length;
}

function flipCard(){
  if(idx >= currentGroup.length) return;
  const c = currentGroup[idx];
  flipped = !flipped;
  const stage = document.getElementById('cardStage');
  const card = stage.querySelector('.flash-card');
  if(!card) return;
  const color = PALETTE[(idx+3) % PALETTE.length];
  if(flipped){
    card.style.setProperty('--accent-a', color[0]);
    card.style.setProperty('--accent-b', color[1]);
    card.innerHTML = '<span class="tag">Türkçe</span>' + formatCardText(c.back) + '<span class="hint">Geri çevirmek için dokun</span>';
    markChecked(c);
  } else {
    const c0 = PALETTE[idx % PALETTE.length];
    card.style.setProperty('--accent-a', c0[0]);
    card.style.setProperty('--accent-b', c0[1]);
    card.innerHTML = '<span class="tag">Almanca</span>' + formatCardText(c.front) + '<span class="hint">Çevirmek için dokun</span>';
  }
}

function nextCard(){
  if(idx < currentGroup.length){ idx++; }
  renderCard();
}
function prevCard(){
  if(idx > 0){ idx--; renderCard(); }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ renderHome(); showScreen('homeScreen'); }
function goSetupBack(){ openSetup(currentSection); }

// swipe support
let touchStartX = null;
document.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(document.getElementById('studyScreen').classList.contains('active')){
    if(dx < -40) nextCard();
    else if(dx > 40) prevCard();
  }
  touchStartX = null;
});

// keyboard support
document.addEventListener('keydown', e=>{
  if(!document.getElementById('studyScreen').classList.contains('active')) return;
  if(e.key === 'ArrowRight') nextCard();
  else if(e.key === 'ArrowLeft') prevCard();
  else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flipCard(); }
});

function toggleFullscreen(){
  document.body.classList.toggle('zen-mode');
  const btn = document.getElementById('fsBtn');
  btn.textContent = document.body.classList.contains('zen-mode') ? '✕' : '⛶';
}

renderHome();
</script>
</body>
</html>
